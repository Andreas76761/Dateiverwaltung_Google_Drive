name: Windows-Programm bauen

on:
  push:
    paths:
      - "tool/dateiumzug.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: pip install --upgrade pyinstaller

      - name: Programm uebersetzen
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Dateiumzug2026
          tool/dateiumzug.py

      - name: Kurzer Startcheck
        run: |
          if (-not (Test-Path dist/Dateiumzug2026.exe)) { throw "Datei wurde nicht erzeugt" }
          $size = (Get-Item dist/Dateiumzug2026.exe).Length / 1MB
          Write-Host ("Erzeugt: {0:N1} MB" -f $size)

      - uses: actions/upload-artifact@v4
        with:
          name: Dateiumzug2026-windows
          path: dist/Dateiumzug2026.exe
          retention-days: 90

      # Zusaetzlich als Veroeffentlichung ablegen. Das gibt einen dauerhaften
      # Link direkt auf die exe -- ohne Anmeldung, ohne ZIP, ohne Actions.
      - name: Als Veroeffentlichung ablegen
        if: github.ref == 'refs/heads/claude/file-management-artifact-s2t2ep'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create werkzeug-neueste `
            --title "Dateiumzug 2026 - Werkzeug" `
            --notes "Windows-Programm fuer den Dateiumzug. Datei herunterladen, entpacken entfaellt, doppelklicken. Beim ersten Start meldet sich Windows mit 'Der Computer wurde geschuetzt' -- auf 'Weitere Informationen' und dann 'Trotzdem ausfuehren' klicken. Das Programm loescht nichts." `
            --latest 2>$null
          $global:LASTEXITCODE = 0
          gh release upload werkzeug-neueste dist/Dateiumzug2026.exe --clobber

      # Die fertige Datei auch ins Repository legen, damit sie ohne Umweg
      # ueber GitHub weitergereicht werden kann.
      - name: Datei ins Repository legen
        if: github.ref == 'refs/heads/claude/file-management-artifact-s2t2ep'
        run: |
          New-Item -ItemType Directory -Force -Path tool/fertig | Out-Null
          Copy-Item dist/Dateiumzug2026.exe tool/fertig/Dateiumzug2026.exe -Force
          (Get-FileHash tool/fertig/Dateiumzug2026.exe -Algorithm SHA256).Hash.ToLower() `
            | Out-File -Encoding ascii -NoNewline tool/fertig/Dateiumzug2026.exe.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tool/fertig
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Gebaute Datei ablegen [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host "Datei unveraendert"
          }
          $global:LASTEXITCODE = 0
